title = "InfiniCharm Gitleaks Security Policy"

[extend]
useDefault = true

[allowlist]
description = "Ignore test fixtures, local json data stores, configuration files, and documentation"
paths = [
  '''(^|/)src/data/.*''',
  '''(^|/)tests/.*''',
  '''(^|/)wrangler\.toml$''',
  '''(^|/)\.github/workflows/.*''',
  '''(^|/)All_Docs/.*''',
  '''(^|/)src/lib/server/password-reset-store\.ts$''',
]
commits = [
